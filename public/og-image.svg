<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Soft Card Shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bg)" />

  <!-- Outer Card Frame -->
  <rect x="24" y="24" width="1152" height="580" rx="32" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />

  <!-- Hero Main Heading (Centered, No Logo) -->
  <g transform="translate(600, 235)">
    <text text-anchor="middle" fill="#0f172a" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="82" font-weight="800" letter-spacing="-2">
      See How Your <tspan fill="#059669">Prevue</tspan> Looks
    </text>
  </g>

  <!-- Subtitle Text (Centered) -->
  <g transform="translate(600, 340)">
    <text text-anchor="middle" fill="#64748b" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="500">
      Generate custom Open Graph metadata and inspect
    </text>
    <text y="46" text-anchor="middle" fill="#64748b" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="32" font-weight="500">
      social card previews instantly.
    </text>
  </g>

  <!-- Bottom Badge: "⚡ Get code instantly" -->
  <g transform="translate(600, 480)">
    <g transform="translate(-115, -22)">
      <!-- Lightning Bolt Icon -->
      <path d="M 12 0 L 2 14 L 10 14 L 8 24 L 20 9 L 11 9 Z" fill="none" stroke="#059669" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" />
      <text x="34" y="18" fill="#0f172a" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">Get code instantly</text>
    </g>
  </g>
</svg>
